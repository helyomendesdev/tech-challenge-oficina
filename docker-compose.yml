services:
  db:
    image: postgres:15
    container_name: oficina_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env  # C5: credenciais lidas do .env, não hardcoded
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # M5: healthcheck para garantir que o banco está pronto antes do app subir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  web:
    build: .
    container_name: oficina_app
    restart: unless-stopped
    # Sem `command:` de proposito: comando explicito nao passa pelo wrapper do
    # agente New Relic, e o compose subiria sem APM sem avisar ninguem. As duas
    # etapas que este comando fazia viraram flags do entrypoint (abaixo).
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - RUN_MIGRATIONS=true
      - RUN_COLLECTSTATIC=true
      - STATIC_ROOT=/tmp/staticfiles
    depends_on:
      db:
        condition: service_healthy  # M5: aguarda o banco estar saudável
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  postgres_data:
