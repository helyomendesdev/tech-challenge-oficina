name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: "test-key-not-for-production"
      DJANGO_SETTINGS_MODULE: "app.settings_test"
      POSTGRES_DB: "oficina_test"
      POSTGRES_USER: "test_user"
      POSTGRES_PASSWORD: "test_pass"

    steps:
    - uses: actions/checkout@v4

    # --- Passo 1: Build da aplicacao ---
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Django system check
      run: python manage.py check --settings=app.settings_test

    # --- Passo 2: Execucao dos testes automatizados ---
    - name: Run tests
      run: |
        python -m pytest atendimento/tests/ -v --tb=short --junitxml=report.xml

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: report.xml

    # --- Passo 3: Build da imagem Docker ---
    - name: Build Docker image
      run: |
        for i in 1 2 3; do
          docker build -t oficina-app:latest . && break
          echo "Tentativa $i falhou. Tentando novamente em 10s..."
          sleep 10
        done

    # --- Passo 4+5+6: Deploy com kind ---
    - name: Create kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: oficina

    - name: Load Docker image into kind
      run: kind load docker-image oficina-app:latest --name oficina

    - name: Deploy to Kubernetes
      run: |
        # Criar namespace primeiro
        kubectl apply -f k8s/namespace.yaml

        # Aplicar ConfigMap antes dos pods
        kubectl apply -f k8s/configmap.yaml

        # Passo 5: Deploy do banco (StatefulSet + Service)
        kubectl apply -f k8s/postgres-statefulset.yaml
        kubectl apply -f k8s/postgres-service.yaml

        # Aguardar banco ficar pronto, mostrando status a cada 30s
        echo "Aguardando postgres-0 ficar Ready..."
        for i in $(seq 1 20); do
          STATUS=$(kubectl get pod postgres-0 -n oficina -o jsonpath='{.status.phase}' 2>/dev/null || echo "Pendente")
          REASON=$(kubectl get pod postgres-0 -n oficina -o jsonpath='{.status.containerStatuses[0].state.waiting.reason}' 2>/dev/null || echo "")
          echo "[$(date +%H:%M:%S)] postgres-0: $STATUS $REASON"
          if kubectl wait --for=condition=ready pod postgres-0 -n oficina --timeout=30s 2>/dev/null; then
            echo "PostgreSQL pronto!"
            break
          fi
        done

        # Se nao ficou pronto, mostrar descricao e sair
        if ! kubectl get pod postgres-0 -n oficina -o jsonpath='{.status.phase}' 2>/dev/null | grep -q Running; then
          echo "=== EVENTOS DO POD ==="
          kubectl describe pod postgres-0 -n oficina 2>/dev/null | tail -30
          exit 1
        fi

        # Passo 4 + 6: Deploy da app + manifests restantes
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/hpa.yaml

        # Aguardar rollout completar
        kubectl rollout status deployment/oficina-app -n oficina --timeout=300s

    - name: Run database migrations
      run: |
        kubectl wait --for=condition=ready pod -l app=oficina-app -n oficina --timeout=120s
        kubectl exec -n oficina deployment/oficina-app -- python manage.py migrate

    - name: Verify deployment
      run: |
        kubectl get pods -n oficina -o wide
        kubectl get svc -n oficina
        kubectl get hpa -n oficina
        echo "---"
        echo "Todos os pods devem estar 1/1 Running acima"
