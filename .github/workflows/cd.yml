name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: "test-key-not-for-production"
      DJANGO_SETTINGS_MODULE: "app.settings_test"
      POSTGRES_DB: "oficina_test"
      POSTGRES_USER: "test_user"
      POSTGRES_PASSWORD: "test_pass"

    steps:
    - uses: actions/checkout@v4

    # --- Passo 1: Build da aplicacao ---
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Django system check
      run: python manage.py check --settings=app.settings_test

    # --- Passo 2: Execucao dos testes automatizados ---
    - name: Run tests
      run: |
        python -m pytest atendimento/tests/ -v --tb=short --junitxml=report.xml

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: report.xml

    # --- Passo 3: Build da imagem Docker ---
    - name: Build Docker image
      run: |
        for i in 1 2 3; do
          docker build -t oficina-app:latest . && break
          echo "Tentativa $i falhou. Tentando novamente em 10s..."
          sleep 10
        done

    # --- Passo 4+5+6: Validar manifests com kind ---
    - name: Create kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: oficina

    - name: Load Docker image into kind
      run: kind load docker-image oficina-app:latest --name oficina

    - name: Validar manifests Kubernetes
      run: |
        kubectl apply --dry-run=client -f k8s/namespace.yaml
        kubectl apply --dry-run=client -f k8s/configmap.yaml
        kubectl apply --dry-run=client -f k8s/deployment.yaml
        kubectl apply --dry-run=client -f k8s/service.yaml
        kubectl apply --dry-run=client -f k8s/hpa.yaml
        kubectl apply --dry-run=client -f k8s/postgres-statefulset.yaml
        kubectl apply --dry-run=client -f k8s/postgres-service.yaml
        echo "✅ Todos os manifests sao validos"

    - name: Deploy aplicacao + banco de dados
      run: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/secret.yaml
        kubectl apply -f k8s/postgres-statefulset.yaml
        kubectl apply -f k8s/postgres-service.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/hpa.yaml
        echo "✅ Todos os manifestos aplicados (banco primeiro, app depois)"

    - name: Aguardar pods ficarem prontos
      run: |
        echo "Aguardando pods do banco..."
        kubectl rollout status statefulset/postgres -n oficina --timeout=120s
        echo "Aguardando pods da aplicacao (inclui migracoes no initContainer)..."
        kubectl rollout status deployment/oficina-app -n oficina --timeout=300s
        echo "✅ Todos os pods estao prontos"
