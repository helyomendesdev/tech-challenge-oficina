name: CI

on:
  push:
    branches: [main, develop, feature/*, fix/*, feat/*]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: "test-key-not-for-production"
      DJANGO_SETTINGS_MODULE: "app.settings_test"
      POSTGRES_DB: "oficina_test"
      POSTGRES_USER: "test_user"
      POSTGRES_PASSWORD: "test_pass"
      DATABASE_URL: "postgres://test_user:test_pass@localhost:5432/oficina_test"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: oficina_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    # Passo 1: Build da aplicacao
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Django system check
      run: python manage.py check --settings=app.settings_test

    # Passo 2: Execucao dos testes automatizados
    - name: Run tests
      run: |
        python manage.py migrate
        python -m pytest atendimento/tests/ scripts/tests/ -v --tb=short --junitxml=report.xml

    # Passo 3: Build da imagem Docker
    - name: Build Docker image
      run: docker build -t oficina-app:latest .

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: report.xml
