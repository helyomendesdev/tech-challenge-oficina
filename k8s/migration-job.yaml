apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-migrate
  namespace: oficina
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: oficina-migrate
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: oficina-app:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "manage.py", "migrate", "--noinput"]
        envFrom:
        - configMapRef:
            name: oficina-config
        - secretRef:
            name: oficina-secret
