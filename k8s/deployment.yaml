apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-app
  namespace: oficina
  labels:
    app: oficina-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: oficina-app
  template:
    metadata:
      labels:
        app: oficina-app
    spec:
      initContainers:
      - name: migrate
        image: oficina-app:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: oficina-config
        - secretRef:
            name: oficina-secret
        command:
        - sh
        - -c
        - |
          echo "Aguardando postgres ficar disponivel..."
          until python -c "import socket; s=socket.create_connection(('oficina-db', 5432), timeout=2); s.close()" 2>/dev/null; do
            echo "Postgres nao esta pronto. Tentando novamente em 3s..."
            sleep 3
          done
          echo "Postgres disponivel. Executando migracoes..."
          python manage.py migrate --noinput
          echo "Migracoes concluidas."
      containers:
      - name: app
        image: oficina-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: oficina-config
        - secretRef:
            name: oficina-secret
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
          failureThreshold: 30
